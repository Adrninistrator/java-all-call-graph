apply plugin: 'java-library'
apply plugin: 'maven-publish'
apply plugin: 'signing'

apply from: 'build.gradle'

// 强制指定源文件编码为 UTF-8，避免 Windows 下 GBK 默认编码导致乱码编译错误
compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
// javadoc 任务同样需要指定 UTF-8 编码，否则读取中文注释会报"不可映射字符"
// 同时关闭 doclint 以避免 @date、@description 等自定义标签导致构建失败
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    // 禁用所有 doclint 检查，解决 @date、@description 等非标准标签报错问题
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.register('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    archiveClassifier.set('sources')

    from sourceSets.main.allJava
}

tasks.register('javadocJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    archiveClassifier.set('javadoc')

    dependsOn javadoc
    from javadoc.destinationDir
}

// 显式声明 generateMetadataFileForMavenJavaPublication 依赖 sourcesJar、javadocJar，
// 避免 Gradle 的 task dependency validation 报错
// 该任务由 maven-publish 插件在 afterEvaluate 阶段动态创建，需使用延迟匹配
tasks.matching { it.name == 'generateMetadataFileForMavenJavaPublication' }.configureEach {
    dependsOn 'sourcesJar', 'javadocJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.name
            version "${version}"
            // from components.java 会将 api/implementation 依赖写入 POM 的 <dependencies> 中
            from components.java
            artifact sourcesJar
            artifact javadocJar

            pom {
                name = "java-all-call-graph"
                description = "Generate all call graph for Java Code."
                url = "https://github.com/Adrninistrator/java-all-call-graph"
                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        id = "Adrninistrator"
                        name = "zhengyiee"
                        email = "zhengyiee@qq.com"
                    }
                }
                scm {
                    connection = "scm:git:https://github.com/Adrninistrator/java-all-call-graph.git"
                    developerConnection = "scm:git:https://github.com/Adrninistrator/java-all-call-graph.git"
                    url = "https://github.com/Adrninistrator/java-all-call-graph"
                }
            }
        }
    }
    repositories {
        maven {
            name = 'localDir'
            url = "${rootProject.projectDir}/build/local-maven-repo"
        }
        maven {
            name 'sonatypeRepository'
            url 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            credentials {
                username = "${NEXUS_USERNAME}"
                password = "${NEXUS_PASSWORD}"
            }
        }
        maven {
            name = 'sonatypeSnapshotRepository'
            url = 'https://ossrh-staging-api.central.sonatype.com/content/repositories/snapshots/'
            credentials {
                username = "${NEXUS_USERNAME}"
                password = "${NEXUS_PASSWORD}"
            }
        }
    }
}

signing {
    sign publishing.publications.mavenJava
}
